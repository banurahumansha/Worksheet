<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}MapBuddyAI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
   <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-93VZS0EY19', { 'debug_mode': true });
  </script>
    <style>
    /* Animated gradient background for hero */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .hero-bg {
      background: linear-gradient(135deg, #6f42c1, #20c997, #6f42c1);
      background-size: 300% 300%;
      animation: gradientShift 15s ease infinite;
    }
  </style>
</head>
<body>

<!-- Hero Section with Animated Gradient -->
<div class="hero position-relative text-white hero-bg" style="overflow: hidden; min-height: 160px; padding: 20px;">

  <!-- Navbar inside hero -->
  <nav class="navbar navbar-expand-lg navbar-dark w-100 px-3 position-relative" style="z-index: 10;">
    <a class="navbar-brand d-flex align-items-center" href="{{ url_for('home') }}">
      <img src="{{ url_for('static', filename='images/logo1.png') }}"
           alt="MapBuddyAI Logo"
           class="rounded-circle"
           style="width: 60px; height: 60px; object-fit: cover;">
      <span class="ms-3 fw-bold">MapBuddyAI</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navMenu">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('pricing') }}">Pricing</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('refund') }}">Refund Policy</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('terms') }}">Terms</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('privacy') }}">Privacy</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Login</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('signup') }}">Sign Up</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('feedback') }}">Feedback</a></li>
      </ul>
    </div>
  </nav>

  <!-- Tagline below logo -->
  <p class="lead mb-0" style="font-size: 0.85rem;">Read less, summarize faster, and map smarter with AI!</p>

  <!-- Waves at bottom -->
  <svg class="position-absolute bottom-0 start-0 w-100" height="40" viewBox="0 0 1440 220" preserveAspectRatio="none" style="z-index: 1;">
    <path fill="#fff" d="M0,224L60,197.3C120,171,240,117,360,112C480,107,600,149,720,181.3C840,213,960,235,1080,218.7C1200,203,1320,149,1380,122.7L1440,96L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path>
  </svg>
</div>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<footer class="bg-dark text-white text-center py-3 mt-5">
  &copy; 2025 MapBuddyAI. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
