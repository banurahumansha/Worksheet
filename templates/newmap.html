<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mind Map Editor</title>
  <style>
    #cy {
  width: 100%;
  height: 600px;
  border: 1px solid #ccc;
}

       #controls {
      margin: 10px 0;
    }
    #controls label {
      margin-right: 5px;
    }
    #controls input, #controls select {
      margin-right: 15px;
    }
    .delete-icon-svg {
stroke: gray;
  transition: all 0.2s ease;
    cursor: pointer;            /* Show pointer on hover */

}

.delete-icon-svg:hover {
  stroke: orange;
  transform: scale(1.2);
}
    .modal-content {
  border-radius: 1rem;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
  border: none;
  background-color: #ffffff;
  transition: all 0.3s ease;
}

/* Modal Body: readable text and scroll support */
.modal-body {
  background-color: #f9f9f9;
  color: #007bff;
  font-size: 1.7rem;
  padding: 1.5rem;
  max-height: 400px;
  overflow-y: auto;
  border-bottom-left-radius: 1rem;
  border-bottom-right-radius: 1rem;
}
.cy-watermark {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 200px;
  opacity: 0.1;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 1;
}

  </style>
    <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://unpkg.com/cytoscape@3.24.0/dist/cytoscape.min.js"></script>
<!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-93VZS0EY19', { 'debug_mode': true });  // Replace with your Measurement ID
  </script> </head>
<body>
<!-- Minimal Sign Out Button (top-right) -->
<a href="#"
   class="btn btn-sm btn-outline-danger position-absolute"
   style="top: 10px; right: 20px; z-index: 2000;"
   data-bs-toggle="modal"
   data-bs-target="#signOutModal">
   🔓  Sign Out
</a>
<!-- Sign Out Modal -->
<div class="modal fade" id="signOutModal" tabindex="-1" aria-labelledby="signOutModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="signOutModalLabel">Sign Out</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to sign out?</p>
        <p class="mt-2 text-muted">Before you go, we’d love your feedback!</p>
        <a href="{{ url_for('feedback') }}" class="btn btn-link p-0">Share Feedback</a>
      </div>
      <div class="modal-footer">
        <form action="{{ url_for('logout') }}" method="post" class="d-inline">
          <button type="submit" class="btn btn-danger">Yes, sign out</button>
        </form>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      </div>
    </div>
  </div>
</div>
<!--side control-->
<div id="controls"
     class="position-absolute bg-light border-bottom d-flex flex-row align-items-center p-2 gap-2"
     style="top:0; left:0; right:0; z-index:10; width:100%; border-radius:0 0 10px 10px;">

  <!-- Action Buttons -->
  <button id="uploadAgainBtn"
        class="btn btn-outline-success btn-sm rounded-2 disable-during-mode"
        title="Upload Another File">
  🔄 Upload Another File
</button>
  <button id="addRoot" class="btn btn-outline-success btn-sm rounded-2 disable-during-mode"
          title="Add Root Node"
          onclick="gtag('event', 'click', { 'event_category': 'Node', 'event_label': 'Add Root Node' });">
    ➕ Add Root Node
  </button>

  <button id="clearMap" class="btn btn-outline-danger btn-sm rounded-2 disable-during-mode"
          title="Clear Map"
          onclick="gtag('event', 'click', { 'event_category': 'Action', 'event_label': 'Clear Map' });">
    🧹 Clear Map
  </button>

  <button id="undoDeleteBtn" class="btn btn-outline-primary btn-sm rounded-2 disable-during-mode"
          title="Undo last delete"
          onclick="gtag('event', 'click', { 'event_category': 'Action', 'event_label': 'Undo Delete Button' });">
    ↩️ Undo Delete
  </button>
<!-- Save -->
<div class="dropdown">
<button class="btn btn-outline-primary btn-sm w-100 rounded-2 dropdown-toggle"
        id="saveDropdown"
        data-bs-toggle="dropdown"
        aria-expanded="false"
        title="Save your mind map"
        style="padding: .25rem .5rem; font-size: .875rem;">
  💾 Save
</button>
  <ul class="dropdown-menu w-100" aria-labelledby="saveDropdown">
    <li>
      <a class="dropdown-item" href="#" id="saveImageBtn"
         onclick="gtag('event', 'click', { 'event_category': 'Save', 'event_label': 'Save PNG' });">🖼️ PNG</a>
    </li>
<!--    <li>-->
<!--      <a class="dropdown-item" href="#" id="savePdfBtn"-->
<!--         onclick="gtag('event', 'click', { 'event_category': 'Save', 'event_label': 'Save PDF' });">📄 PDF</a>-->
<!--    </li>-->
<!--    <li>-->

<!--         onclick="gtag('event', 'click', { 'event_category': 'Save', 'event_label': 'Save Freeplane (.mm)' });">🧠 Freeplane (.mm)</a>-->
<!--    </li>-->
<!--    <li>-->
<!--      <a class="dropdown-item" href="#" id="saveJsonBtn"-->
<!--         onclick="gtag('event', 'click', { 'event_category': 'Save', 'event_label': 'Save JSON' });">🔄 JSON</a>-->
<!--    </li>-->
<!--    <li>-->
<!--      <a class="dropdown-item" href="#" id="saveDocnBtn"-->
<!--         onclick="gtag('event', 'click', { 'event_category': 'Save', 'event_label': 'Save DOC' });">📄 DOC</a>-->
<!--    </li>-->
  </ul>
</div>

  <!-- Dropdown for Style Controls -->
  <div class="dropdown">
    <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" id="styleMenu" data-bs-toggle="dropdown" aria-expanded="false">
      ⚙️ Style Settings
    </button>
    <div class="dropdown-menu p-3" style="min-width: 250px;" aria-labelledby="styleMenu">

      <!-- Node Border Color -->
      <label for="nodeColor" class="form-label small">Node Border Color:</label>
      <input type="color" id="nodeColor" value="#007bff" class="form-control form-control-sm mb-2"
             onchange="gtag('event', 'change', { 'event_category': 'Style', 'event_label': 'Node Border Color' }); changeNodeBorderColor(this.value)">

      <!-- Edge Color -->
      <label for="edgeColor" class="form-label small">Edge Color:</label>
      <input type="color" id="edgeColor" value="#888888" class="form-control form-control-sm mb-2"
             onchange="gtag('event', 'change', { 'event_category': 'Style', 'event_label': 'Edge Color' }); changeEdgeColor(this.value)">

      <!-- Node Shape -->
      <label for="nodeShape" class="form-label small">Node Shape:</label>
      <select id="nodeShape" class="form-select form-select-sm mb-2"
              onchange="gtag('event', 'change', { 'event_category': 'Style', 'event_label': 'Node Shape' }); changeNodeShape(this.value)">
        <option value="roundrectangle">Rounded</option>
        <option value="ellipse">Ellipse</option>
        <option value="rectangle">Rectangle</option>
        <option value="hexagon">Hexagon</option>
      </select>

      <!-- Edge Style -->
      <label for="edgeStyle" class="form-label small">Line Style:</label>
      <select id="edgeStyle" class="form-select form-select-sm mb-2"
              onchange="gtag('event', 'change', { 'event_category': 'Style', 'event_label': 'Edge Line Style' }); changeEdgeLineStyle(this.value)">
        <option value="solid">Solid</option>
          <option value="upward">Upward Arc</option>
        <option value="downward">Downward Arc</option>
        <option value="dashed">Dashed</option>
        <option value="dotted">Dotted</option>
      </select>

      <!-- Arrow Shape -->
      <label for="arrowShape" class="form-label small">Arrow:</label>
      <select id="arrowShape" class="form-select form-select-sm"
              onchange="gtag('event', 'change', { 'event_category': 'Style', 'event_label': 'Arrow Shape' }); changeEdgeArrow(this.value)">
        <option value="triangle">Triangle</option>
        <option value="vee">Vee</option>
        <option value="none">None</option>
      </select>
    </div>

  </div>

</div>

<div id="cy-container" style="position: relative; height:100%; width:100%;">
  <div id="cy">

     <div id="zoomControls" style="
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 999;
  ">
    <button id="zoomOutBtn" title="Zoom Out">−</button>
    <button id="resetZoomBtn" title="Reset Zoom">⭕</button>
    <button id="zoomInBtn" title="Zoom In">+</button>
  </div>
  </div>
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="cy-watermark">
</div>


<!-- Error Modal -->
</body>
<!-- Error Modal -->
<div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-danger text-white">
      <div class="modal-header">
        <h5 class="modal-title" id="errorModalLabel">Input Error</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="errorModalBody">
        <!-- Error message will be injected here -->
      </div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
  <div id="toastContainer" class="toast align-items-center text-white bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage">Action message here</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/newmap.js') }}"></script>
<footer class="bg-dark text-white text-center py-3 mt-5">
  &copy; 2025 MapBuddyAI. All rights reserved.
</footer>
</html>
