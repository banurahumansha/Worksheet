<!-- Worksheet Form (Tailwind) -->
<div class="flex justify-center pt-10 flex-grow">
  <div class="bg-white shadow-md rounded-xl w-full max-w-3xl p-6">
    <h1 class="text-xl font-bold text-gray-800 mb-4 text-center">Generate Worksheet</h1>
<form id="worksheetForm" action="{{ url_for('generate_worksheet') }}" method="POST" enctype="multipart/form-data" class="space-y-4">

     <!-- Curriculum (Required) -->
      <div>
        <label for="curriculum" class="font-medium text-gray-700">Curriculum *</label>
        <input type="text" id="curriculum" placeholder="Enter your curriculum (e.g., IGCSE , CBSE, IB, GCE, Other)" required
               class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- Grade / Level (Required) -->
      <div>
        <label for="grade" class="font-medium text-gray-700">Grade / Level *</label>
        <select id="grade" required
                class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Select Grade</option>
          <option value="1">Grade 1</option>
          <option value="2">Grade 2</option>
          <option value="3">Grade 3</option>
          <option value="4">Grade 4</option>
          <option value="5">Grade 5</option>
          <option value="6">Grade 6</option>
          <option value="7">Grade 7</option>
          <option value="8">Grade 8</option>
          <option value="9">Grade 9</option>
          <option value="10">Grade 10</option>
          <option value="11">Grade 11</option>
          <option value="12">Grade 12</option>
        </select>
      </div>

      <!-- Subject (Required) -->
      <div>
        <label for="subject" class="font-medium text-gray-700">Subject *</label>
        <select id="subject" required
                class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Select Subject</option>
          <option value="Math">Math</option>
          <option value="Science">Science</option>
          <option value="Physics">Physics</option>
          <option value="Chemistry">Chemistry</option>
          <option value="Biology">Biology</option>
          <option value="English">Language</option>
          <option value="History">History</option>
          <option value="Geography">Geography</option>
           <option value="ICT">ICT</option>
          <option value="Other">Other</option>
        </select>

        <!-- Custom subject input (hidden initially, required if Other) -->
        <input type="text" id="customSubject" placeholder="Type your subject"
               class="mt-2 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 hidden">
      </div>

      <!-- Topic / Notes (Required) -->
  <!-- Topic / Notes (Required) -->
<div class="w-full flex gap-4">
  <!-- Textarea -->
  <div class="flex-1">
    <label for="textContent" class="font-medium text-gray-700">Topic / Notes</label>
    <textarea id="textContent" rows="5"
      placeholder="Enter topic for generating worksheet e.g., Solar system"
      class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
  </div>

  <!-- Suggestions (Right side) -->
  <div id="suggestion-bubbles" class="flex flex-col gap-2 w-80"></div>
</div>

<!--      <div class="relative w-full">-->
<!--        <label for="textContent" class="font-medium text-gray-700">Topic / Notes </label>-->
<!--        <textarea id="textContent" rows="5" placeholder="Enter topic for generating worksheet e.g., Solar system"-->
<!--                  class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>-->
<!--          <div id="suggestion-bubbles"></div>-->

<!-- Upload File (Optional) -->
<div>
  <label for="uploadFile" class="font-medium text-gray-700">Or Upload Reference Material (PDF, DOCX, TXT)</label>
  <input type="file" id="uploadFile" accept=".pdf,.doc,.docx,.txt"
         class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
</div>

      <!-- Subtopics (Optional) -->
      <div>
        <label for="subtopics" class="font-medium text-gray-700">Subtopics (optional)</label>
        <input type="text" id="subtopics" placeholder="Enter subtopics e.g., Planets, Sun, Moons, Asteroids"
               class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- Additional Notes (Optional) -->
      <div>
        <label for="notes" class="font-medium text-gray-700">Additional Instructions (optional)</label>
        <textarea id="notes" rows="3" placeholder="Provide guidance to AI e.g.,: 'Emphasize critical thinking and reasoning questions , Real-World Applications.'"
                  class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      </div>

      <!-- Include Options in One Row (Optional) -->
<!--      <legend class="font-medium text-gray-700 text-sm">Include in Worksheet</legend>-->
<!--      <div class="flex items-center space-x-6 mt-2">-->
<!--        <label class="flex items-center space-x-2">-->
<!--          <input type="checkbox" id="includeCharts" class="form-checkbox text-indigo-500">-->
<!--          <span class="font-medium text-gray-700">Charts</span>-->
<!--        </label>-->
<!--        <label class="flex items-center space-x-2">-->
<!--          <input type="checkbox" id="includeDiagrams" class="form-checkbox text-indigo-500">-->
<!--          <span class="font-medium text-gray-700">Diagrams</span>-->
<!--        </label>-->
<!--        <label class="flex items-center space-x-2">-->
<!--          <input type="checkbox" id="includeScenarios" class="form-checkbox text-indigo-500">-->
<!--          <span class="font-medium text-gray-700">Scenarios</span>-->
<!--        </label>-->
<!--      </div>-->

      <!-- Question Types (Required via JS) -->
      <div>
        <label class="font-medium text-gray-700">Question Types *</label>
        <p class="text-gray-500 text-sm mt-1">Select multiple types or choose "Mix" for a combination.</p>
        <div class="flex flex-wrap gap-4 mt-1">
          <label class="flex items-center space-x-1">
            <input type="checkbox" name="qtype" value="MCQ" class="form-checkbox text-indigo-500">
            <span>MCQ</span>
          </label>
          <label class="flex items-center space-x-1">
            <input type="checkbox" name="qtype" value="Short" class="form-checkbox text-indigo-500">
            <span>Short Answer</span>
          </label>
          <label class="flex items-center space-x-1">
            <input type="checkbox" name="qtype" value="FIB" class="form-checkbox text-indigo-500">
            <span>Fill in the Blank</span>
          </label>
          <label class="flex items-center space-x-1">
            <input type="checkbox" name="qtype" value="TrueFalse" class="form-checkbox text-indigo-500">
            <span>True/False</span>
          </label>
          <label class="flex items-center space-x-1">
            <input type="checkbox" name="qtype" value="Match" class="form-checkbox text-indigo-500">
            <span>Match the Following</span>
          </label>
          <label class="flex items-center space-x-1">
            <input type="checkbox" name="qtype" value="Sequencing" class="form-checkbox text-indigo-500">
            <span>Sequencing / Ordering</span>
          </label>
            <label class="flex items-center space-x-1">
            <input type="checkbox" name="qtype" value="Puzzle" class="form-checkbox text-indigo-500">
            <span>Puzzle</span>
          </label>
           </div>
      </div>

      <!-- Number of Questions (Required) -->
      <div>
        <label for="numQuestions" class="font-medium text-gray-700">Number of Questions </label>
        <input type="number" id="numQuestions" value="5" min="1"
               class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- Difficulty (Required) -->
      <div>
        <label for="difficulty" class="font-medium text-gray-700">Difficulty</label>
        <select id="difficulty"
                class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Select Difficulty</option>
          <option>Easy</option>
          <option>Medium</option>
          <option>Hard</option>
        </select>
      </div>

      <!-- Exam Type / Format (Required) -->
      <div>
        <label for="examType" class="font-medium text-gray-700">Exam Type / Format </label>
        <select id="examType"
                class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Select Exam Type</option>
          <option value="Worksheet">Worksheet</option>
          <option value="Test">Test</option>
          <option value="Homework">Homework</option>
          <option value="Quiz">Quiz</option>
        </select>
      </div>

      <!-- Optional Time and Marks -->
      <div class="flex flex-wrap gap-4">
        <div class="flex-1 min-w-[150px]">
          <label for="duration" class="font-medium text-gray-700">Suggested Duration (minutes, optional)</label>
          <input type="number" id="duration" min="1" placeholder="e.g., 30"
                 class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="flex-1 min-w-[150px]">
          <label for="totalMarks" class="font-medium text-gray-700">Total Marks (optional)</label>
          <input type="number" id="totalMarks" min="1" placeholder="e.g., 10"
                 class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <p class="text-gray-500 text-sm text-center mb-2">
        Note: Answer key is provided on the last page.
      </p>

      <!-- Submit -->
      <div class="text-center">
        <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2 rounded-lg shadow-md transition-all">
          Generate Worksheet
        </button>
      </div>
    </form>
  </div>
</div>
    </form>
  <!-- Loader -->
<div id="loader" style="display: none;">
  <div class="flex flex-col items-center justify-center h-screen w-screen bg-black bg-opacity-50 text-white text-lg font-semibold z-50 fixed top-0 left-0">
    <div class="spinner mb-2"></div>
    Generating worksheet, please wait...
  </div>
</div>

<div id="error-message" style="
    display:none;
    color:white;
    background-color:red;
    padding:8px 12px;
    border-radius:4px;
    margin:10px 0;
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    font-weight:bold;
"></div>

  </div>
</div>
<script src="{{ url_for('static', filename='js/worksheet_input.js') }}"></script>
